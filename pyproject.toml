[project]
name = "opensearch-hybrid-sparse-search"
version = "0.1.0"
description = "Local OpenSearch hybrid search (BM25 + neural sparse, doc-only mode) with FastAPI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "opensearch-py>=2.6",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]
# Multimodal chapter only. Heavy (pulls in torch), so it's opt-in:
#   uv sync --extra multimodal   (or `make sync-multimodal`)
multimodal = [
    "sentence-transformers>=3.0",
    "Pillow>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
